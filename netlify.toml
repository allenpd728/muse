# Netlify — QA/preview only, never production.
# Publishes docs/spike/ as a static listener page. No build step.
# The site (muse-qa-58fd708e) builds the dev branch per repo convention.

[build]
  base = "docs/spike"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
