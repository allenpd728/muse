<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse seed workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#0d1117; color:#c9d1d9; margin:0; padding:2rem; }
  h1 { font-size:1.4rem; color:#f0f6fc; }
  h2 { font-size:1.05rem; color:#8b949e; border-bottom:1px solid #30363d; padding-bottom:.3rem; margin-top:2rem; }
  .work { margin-bottom:3rem; }
  .panel { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
  @media (max-width: 900px) { .panel { grid-template-columns: 1fr; } }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; }
  .card h3 { margin-top:0; font-size:.85rem; color:#58a6ff; text-transform:uppercase; letter-spacing:.05em; }
  pre { overflow-x:auto; font-size:.75rem; line-height:1.35; color:#a5d6ff; }
  .probe { display:flex; justify-content:space-between; padding:.25rem 0; font-size:.8rem; border-bottom:1px dashed #21262d; }
  .probe:last-child { border-bottom:none; }
  .pass { color:#3fb950; }
  .fail { color:#f85149; }
  .warn { color:#d29922; }
  table { border-collapse:collapse; width:100%; font-size:.78rem; }
  td, th { padding:.3rem .5rem; text-align:left; border-bottom:1px solid #21262d; }
  th { color:#8b949e; }
  .tag { font-size:.68rem; padding:.1rem .4rem; border-radius:6px; background:#21262d; color:#8b949e; }
  .ok { background:#238636; color:#fff; }
  .controls { display:flex; gap:1rem; align-items:center; margin:1rem 0; padding:.75rem 1rem; background:#161b22; border:1px solid #30363d; border-radius:8px; }
  .controls select, .controls button { background:#0d1117; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:.3rem .6rem; font:inherit; }
  .controls button { cursor:pointer; color:#58a6ff; border-color:#58a6ff; }
  .controls button:hover { background:#58a6ff; color:#0d1117; }
  .probe-detail { margin-top:.5rem; }
  .probe-detail summary { cursor:pointer; color:#58a6ff; font-size:.78rem; }
  .probe-detail table { margin-top:.4rem; }
  audio { width:100%; height:36px; }
  .audio-note { color:#8b949e; font-size:.75rem; margin:.3rem 0 0; }
  .rev { margin-bottom:.8rem; }
  .rev:last-child { margin-bottom:0; }
  .rev-head { display:flex; gap:.6rem; align-items:baseline; margin-bottom:.2rem; }
  .rev-label { color:#f0f6fc; font-size:.85rem; }
  .rev-meta { color:#8b949e; font-size:.72rem; margin-left:auto; }
</style>
</head>
<body>
<h1>Muse seed workbench</h1>
<p class="tag">QA-only, static. Read surface for seed iterations. Editing happens in the repo.</p>
<div id="works"></div>
<script>
async function loadJSON(p) { const r = await fetch(p); return r.ok ? r.json() : null; }
async function loadText(p) { const r = await fetch(p); return r.ok ? r.text() : null; }

// Minimal YAML → object for the seed fields the panel renders (params +
// philosophy). The seed is also committed as JSON in the probes artifact,
// but the panel reads the authored YAML directly.
function parseSeedYaml(text) {
  const seed = { params: {}, philosophy: {}, work_id: '?', format_version: '?' };
  let section = null, subsection = null;
  for (const raw of text.split('\n')) {
    const line = raw.replace(/\s+#.*$/, '');
    if (!line.trim()) continue;
    const indent = line.match(/^ */)[0].length;
    const m = line.trim().match(/^([^:]+):\s*(.*)$/);
    if (!m) continue;
    const [, key, val] = m;
    if (indent === 0) {
      if (key === 'params' || key === 'philosophy') { section = key; subsection = null; }
      else { section = null; seed[key] = val.replace(/^['"]|['"]$/g, ''); }
    } else if (section && indent === 2) {
      if (val === '') { subsection = key; seed[section][key] = {}; }
      else seed[section][key] = val;
    } else if (section && subsection && indent >= 4) {
      seed[section][subsection][key] = val;
    }
  }
  return seed;
}

function seedPanel(seed) {
  if (!seed) return '<div class="card"><h3>Seed</h3><p>none committed</p></div>';
  return `<div class="card"><h3>Seed — ${seed.work_id} v${seed.format_version}</h3>
    <pre>${JSON.stringify(seed.params, null, 2)}</pre>
    <pre>${JSON.stringify(seed.philosophy, null, 2)}</pre></div>`;
}

function probePanel(probes, workId) {
  if (!probes || !probes.ok) return '<div class="card"><h3>Probes</h3><p class="fail">no probe artifact</p></div>';
  const P = probes.probes;
  let rows = '';
  if (P.assertions) {
    for (const a of P.assertions.assertions) {
      rows += `<div class="probe"><span>assertion: ${a.kind}</span><span class="${a.status}">${a.status}</span></div>`;
    }
  }
  if (P.budget_fit) {
    for (const c of P.budget_fit.checks) {
      const cls = c.inside ? 'pass' : 'warn';
      // Threshold chip: span shows mean deviation; out-of-budget reads
      // explicitly "outside budget (avg span N.x)" instead of raw float.
      const txt = c.inside ? 'inside budget'
        : c.span_fraction ? `outside budget (avg span ${c.span_fraction}x)` : 'outside budget';
      rows += `<div class="probe"><span>budget: ${c.param}</span><span class="${cls}">${txt}</span></div>`;
    }
  }
  if (P.coverage) rows += `<div class="probe"><span>variation coverage</span><span>${P.coverage.exercised}/${P.coverage.total || 0}</span></div>`;
  if (P.determinism) rows += `<div class="probe"><span>determinism</span><span class="${P.determinism.stable ? 'pass' : 'fail'}">${P.determinism.stable ? 'stable' : 'unstable'}</span></div>`;
  if (P.fidelity_guard) rows += `<div class="probe"><span>score fidelity</span><span class="${P.fidelity_guard.fidelity ? 'pass' : 'fail'}">${P.fidelity_guard.fidelity ? 'clean' : 'deviation'}</span></div>`;
  const delta = P.delta_curves && P.delta_curves.parts ? P.delta_curves.parts : {};
  const deltaRows = Object.entries(delta).map(([part, s]) =>
    `<tr><td>${part}</td><td>${s.source_ioi_mean}</td><td>${s.mockup_ioi_mean}</td><td>${s.drift_ratio}</td></tr>`).join('');
  return `<div class="card"><h3>Probes</h3>${rows || '<p>no probes</p>'}
    <details class="probe-detail" data-probe="delta-curves"><summary>delta curves per part</summary>
      <table><tr><th>part</th><th>source IOI</th><th>mockup IOI</th><th>drift</th></tr>${deltaRows}</table>
    </details>
    <details class="probe-detail" data-probe="budget-detail"><summary>budget detail</summary>
      <pre>${JSON.stringify(P.budget_fit, null, 2)}</pre>
    </details>
  </div>`;
}

function audioPanel(workId, audio) {
  const revs = audio && audio.works && audio.works[workId];
  if (!revs) {
    return `<div class="card"><h3>Audio</h3>
      <audio controls preload="none" src="/audio/${workId}.wav"
        onerror="this.parentElement.querySelector('.audio-note').textContent='not rendered yet — render with tools/muse_play'"></audio>
      <p class="audio-note"></p>
    </div>`;
  }
  const players = Object.entries(revs).map(([label, info]) => `
    <div class="rev">
      <div class="rev-head"><span class="rev-label">${label}</span>
        <span class="tag">${info.origin}</span>
        <span class="rev-meta">${info.duration_sec}s · ${info.notes} notes</span></div>
      <audio controls preload="none" src="/audio/${info.file}"
        onerror="this.closest('.rev').querySelector('.audio-note').textContent='not rendered in this session — regenerate: tools/muse_audio (see docs/audio/README.md)'"></audio>
      <p class="audio-note"></p>
    </div>`).join('');
  return `<div class="card"><h3>Audio — seed revisions</h3>${players}</div>`;
}

function growthPanel(workId, growth) {
  if (!growth) return '';
  const rows = Object.entries(growth).map(([trait, info]) => {
    const cls = info.verdict === 'growing' ? 'pass' : (info.verdict === 'regressing' ? 'fail' : '');
    const detail = info.delta !== undefined && info.delta !== null ? ` (${info.delta > 0 ? '+' : ''}${info.delta})` :
      (info.from ? ` (${info.from} → ${info.to})` : '');
    return `<div class="probe"><span>${trait}</span><span class="${cls}">${info.verdict}${detail}</span></div>`;
  }).join('');
  return `<div class="card"><h3>Growth (v1 → v2)</h3>${rows}
    <p class="note">per-trait verdicts from the distiller's iteration compare</p></div>`;
}

async function loadGrowth(workId) {
  const name = `${workId}.growth.v1-to-v2.json`;
  return await loadJSON(`data/seeds/${name}`);
}

async function main() {
  const works = await loadJSON('data/works.json');
  const container = document.getElementById('works');
  const seedIndex = await loadJSON('data/seeds/index.json') || { seeds: [] };
  const audio = await loadJSON('/audio/manifest.json');

  // era filter + refresh controls
  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML = `
    <label>era budget:
      <select id="era-select">
        <option value="baroque">baroque</option>
        <option value="classical">classical</option>
        <option value="romantic">romantic</option>
      </select>
    </label>
    <button id="refresh-btn">refresh probes</button>
    <span class="note" id="refresh-note"></span>`;
  container.before(controls);

  const eraSelect = document.getElementById('era-select');
  eraSelect.addEventListener('change', () => renderAll(seedIndex));
  document.getElementById('refresh-btn').addEventListener('click', () => {
    document.getElementById('refresh-note').textContent =
      'probes are deterministic from the committed seed — re-run tools/muse_explorer/generate.py after editing a seed, then reload';
  });

  async function renderAll(idx) {
    container.innerHTML = '';
    for (const entry of idx.seeds) {
      const seedText = await loadText(`data/seeds/${entry.file}`);
      const seed = seedText ? parseSeedYaml(seedText) : null;
      const probes = await loadJSON(`data/seeds/${entry.probes}`);
      const growth = await loadGrowth(entry.work_id);
      const div = document.createElement('div');
      div.className = 'work';
      div.innerHTML = `<h2>${entry.work_id} <span class="tag ok">${probes && probes.ok ? 'passing' : 'no probes'}</span></h2>
        <div class="panel">${seedPanel(seed)}${probePanel(probes, entry.work_id)}${growthPanel(entry.work_id, growth)}${audioPanel(entry.work_id, audio)}</div>`;
      container.appendChild(div);
    }
    if (!idx.seeds.length) {
      container.innerHTML += '<p>No seeds committed yet. The loop: edit → validate → mockup → probe (docs/seed-iteration.md).</p>';
    }
  }
  await renderAll(seedIndex);
}
main().catch(e => { document.getElementById('works').innerHTML = `<p class="fail">load error: ${e}</p>`; });
</script>
</body>
</html>
