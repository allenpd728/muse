<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse — corpus tree (workbench)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#0d1117; color:#c9d1d9; margin:0; padding:2rem; }
  h1 { font-size:1.4rem; color:#f0f6fc; }
  .tag { font-size:.68rem; padding:.1rem .4rem; border-radius:6px; background:#21262d; color:#8b949e; }
  .logo { float:right; color:#8b949e; font-size:.75rem; }
  .work { margin:1.2rem 0; }
  .work > summary { cursor:pointer; font-size:.95rem; color:#58a6ff; list-style:none; }
  ul.files { margin:.4rem 0 .8rem; padding-left:1.4rem; list-style:none; }
  ul.files li { padding:.25rem 0; border-bottom:1px dashed #21262d; }
  ul.files li:last-child { border-bottom:none; }
  ul.files a { color:#c9d1d9; text-decoration:none; }
  ul.files a:hover { color:#58a6ff; }
  .fid { color:#8b949e; font-size:.75rem; }
  .seed-pill { font-size:.65rem; padding:.08rem .45rem; border-radius:5px; margin-left:.5rem; }
  .seeded { background:#238636; color:#fff; }
  .unseeded { background:#f85149; color:#fff; }
</style>
</head>
<body>
<header><h1>Muse corpus tree <span class="tag">QA static</span><span class="logo">/` route index</span></h1></header>
<nav>
  <p>
    <a href="explorer/">/explorer/ — corpus browser</a> ·
    <a href="workbench/">/workbench/ (spans) → detail page</a> ·
    <a href="workbench/terminal/">/workbench/terminal/ (W-B8)</a>
  </p>
</nav>
<div id="tree">loading corpus…</div>
<script>
// Five reference works. Each has per-file ids (movements for bwv227/byrd,
// single files for schubert/beethoven). Every file gets an explicit
// seeded / not-yet-seeded marker — the page can't imply "the corpus is one
// piece".
const WORKS = [
  { id: 'bwv227', title: 'Bach — Jesu meine Freude BWV 227 (chorale movements)', files: ['bwv227.1','bwv227.2','bwv227.3','bwv227.4'] },
  { id: 'byrd-mass3v', title: 'Byrd — Mass for Three Voices', files: ['byrd-mass3v.kyrie','byrd-mass3v.gloria','byrd-mass3v.credo','byrd-mass3v.sanctus','byrd-mass3v.agnus','byrd-mass3v.ite'] },
  { id: 'schubert-d810', title: 'Schubert — Death and the Maiden D.810 (complete quartet)', files: ['schubert-d810'] },
  { id: 'beethoven-sym5-mov1', title: 'Beethoven — Symphony 5, mov 1', files: ['beethoven-sym5-mov1'] },
  { id: 'beethoven-sym9', title: 'Beethoven — Symphony No. 9 (complete)', files: ['beethoven-sym9'] },
];

async function loadJSON(p) { const r = await fetch(p); return r.ok ? r.json() : null; }
function classify(files, fid) { return files.includes(fid) ? 'seeded' : 'unseeded'; }
function paint(work, seededIds) {
  const ul = document.createElement('ul');
  ul.className = 'files';
  for (const fid of work.files) {
    const li = document.createElement('li');
    const state = classify(seededIds, fid);
    li.innerHTML = `<a href="workbench/detail.html#${fid}">${fid}<span class="fid">${work.title}</span><span class="seed-pill ${state}">${state}</span></a>`;
    ul.appendChild(li);
  }
  return ul;
}
async function main() {
  const idx = await loadJSON('workbench/data/seeds/index.json') || { seeds: [] };
  const seededIds = idx.seeds.map(e => e.work_id);
  const container = document.getElementById('tree');
  container.innerHTML = '';
  for (const work of WORKS) {
    const div = document.createElement('div');
    div.className = 'work';
    div.innerHTML = `<summary>${work.title}<span class="fid"> (${work.files.length} files)</span></summary>`;
    div.appendChild(paint(work, seededIds));
    container.appendChild(div);
  }
}
main().catch(e => { document.getElementById('tree').innerHTML = `<p class="seed-pill unseeded">load error: ${e}</p>`; });
</script>
</body>
</html>
