# tools/pytest.ini — shared pytest config. rootdir resolves here for every
# `python3 -m pytest <suite>` the runner invokes from tools/, so markers
# registered here apply repo-wide (issue #214).
[pytest]
markers =
    slow: too heavy for the fast tier (Beethoven-9 scale); run_tests.sh fast tier deselects via -m "not slow", --full includes
