name: retry-flaky

# Auto re-run failed jobs of the conformance workflow when a failure is
# plausibly flaky (runner-level: timeout, runner hiccup, etc.).
#
# Trigger: conformance completed + conclusion == failure. We re-run
# ONLY the failed jobs (`gh run rerun --failed`) — never the whole pipeline.
#
# Loop safety:the workflow_run payload's `run_attempt` field is the
# attempt number of the *triggering* run. We only act on `run_attempt
# == 1` (the first try), so a retry-run(attempt 2+, itself
# failing) cannot trigger another retry. One bounded retry per CI run;a
# second failure needs a human look (the manual escape hatch:
# `gh run rerun <ID> --failed`).
#
"on":
  workflow_run:
    workflows: [conformance]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs of conformance run
        run: |
          set -euo pipefail
          echo "re-running failed jobs of conformance run ${{ github.event.workflow_run.id }}..."
          gh run rerun "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --failed
          echo "retry requested."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}