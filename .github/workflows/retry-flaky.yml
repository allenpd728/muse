name: retry-flaky

# Manual one-shot re-run of failed conformance jobs. Triggered only by
# explicit invocation (`workflow_dispatch`), never by another run.

# History: #293 shipped an auto-retry fired on completed conformance runs.
# Live verification (#295) caught a self-trigger loop: the rerun command
# re-emits an event-as-a-brand-new-run, so no attempt-count guard could
# trip; GitHub event model cannot make event-triggered auto-retry safe in
# this topology,and every iteration burns Actions minutes (billing).
# Hence: dispatch-only, one re-run per explicit invocation. A second
# failure needs a human look, not another retry.

"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: "Conformance run ID whose failed jobs to re-run (one-shot)"
        required: true
        type: number

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs of conformance run
        run: |
          set -euo pipefail
          run_id="${{ inputs.run_id }}"
          case "$run_id" in
            ''|*[!0-9]*) echo "error: run_id must be a numeric run ID (got: $run_id)" >&2; exit 1;;
          esac
          echo "re-running failed jobs of conformance run $run_id..."
          gh run rerun "$run_id" --repo "${{ github.repository }}" --failed
          echo "retry requested."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
